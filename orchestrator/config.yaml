paths:
  memory_dir: .ai-memory
  workspace_dir: workspace
  phases_dir: phases
  prompts_dir: orchestrator/prompts

agents:
  antigravity:
    enabled: true
    command: "agy"
    arguments: ["--mode", "plan", "-p", "{prompt}"]
    timeout_seconds: 600
  codex:
    enabled: true
    command: "codex"
    arguments: ["exec", "--sandbox", "workspace-write", "--color", "never", "-"]
    timeout_seconds: 1200
  cursor:
    enabled: true
    command: "agent"
    arguments: ["-p", "--output-format", "text", "{prompt}"]
    timeout_seconds: 600

logging:
  level: INFO

workflow:
  max_review_cycles: 3
  require_approval: true

checks:
  commands: []
  timeout_seconds: 600

git:
  allow_commit: false
  commit_message: "AI team: complete {phase_id}"
